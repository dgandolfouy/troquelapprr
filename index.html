            <div class="w-1/2 relative">
                <label class="block text-[10px] uppercase text-gray-400 mb-1 font-bold tracking-wider ml-1">Ancho (mm)</label>
                <input type="number" id="inpAncho" class="input-dark w-full p-3 rounded-xl text-center text-xl font-mono" placeholder="0">
            </div>
            <div class="w-1/2 relative">
                <label class="block text-[10px] uppercase text-gray-400 mb-1 font-bold tracking-wider ml-1">Largo (mm)</label>
                <input type="number" id="inpLargo" class="input-dark w-full p-3 rounded-xl text-center text-xl font-mono" placeholder="0">
            </div>
        </div>
        
        <div class="flex gap-3 mb-6">
            <div class="w-1/2">
                <label class="block text-[10px] uppercase text-gray-400 mb-1 font-bold tracking-wider ml-1">Formato</label>
                <select id="inpFormato" class="input-dark w-full p-3 rounded-xl text-sm">
                    <option value="">Todos</option>
                    <option value="CIRCULAR">CIRCULAR</option>
                    <option value="CORTE RECTO">CORTE RECTO</option>
                    <option value="RECTANGULAR">RECTANGULAR</option>
                </select>
            </div>
            <div class="w-1/2">
                <label class="block text-[10px] uppercase text-gray-400 mb-1 font-bold tracking-wider ml-1">Código Troquel</label>
                <input type="text" id="inpCodigo" class="input-dark w-full p-3 rounded-xl text-center text-sm uppercase" placeholder="Ej: M0297">
            </div>
        </div>

        <div class="flex items-center justify-center gap-2 mb-4">
            <label class="text-[10px] text-gray-400 uppercase font-bold">Tolerancia ± (mm):</label>
            <input type="number" id="inpTolerancia" value="5" class="input-dark w-16 p-1 rounded text-center text-sm font-mono focus:border-orange-500 border border-neutral-600">
        </div>

        <button id="btnBuscar" onclick="buscarTroqueles()" class="btn-naranja w-full p-4 rounded-xl shadow-lg flex justify-center items-center gap-2">
            <i class="fas fa-search"></i> <span>BUSCAR</span>
        </button>
    </div>

    <div id="loadingStatus" class="text-orange-500 text-sm mb-4 animate-pulse text-center">
        <i class="fas fa-sync fa-spin mr-2"></i> Cargando base de datos...
    </div>

    <div class="w-full max-w-md">
        <h3 class="text-gray-400 text-xs font-bold uppercase mb-3 flex justify-between">
            <span>Resultados</span>
            <span id="contadorResultados" class="text-orange-500"></span>
        </h3>
        <div id="resultadosContenedor" class="space-y-3 pb-6"></div>
        <div id="resultadosInvertidosContenedor" class="hidden border-t-2 border-dashed border-gray-700 pt-6 mt-6">
            <h3 class="text-orange-400 text-xs font-bold uppercase mb-3 flex items-center gap-2">
                <i class="fas fa-retweet"></i> Sugerencias Rotadas
            </h3>
            <div id="listaInvertidos" class="space-y-3"></div>
        </div>
    </div>

    <div id="modalImagen" class="fixed inset-0 z-50 hidden" onclick="cerrarModal()">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-sm"></div>
        <div class="modal-content relative w-full h-full flex items-center justify-center p-4">
            <div class="w-full max-w-sm bg-neutral-800 rounded-2xl overflow-hidden shadow-2xl border border-white/10" onclick="event.stopPropagation()">
                <div class="p-4 bg-neutral-900 flex justify-between items-center">
                    <h3 id="modalTitulo" class="text-white font-bold text-lg">...</h3>
                    <button onclick="cerrarModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
                </div>
                <div class="aspect-square bg-black flex items-center justify-center relative">
                    <img id="modalImg" class="w-full h-full object-contain" style="display:none;">
                    <div id="errorImg" class="text-center" style="display:none;">
                        <i class="fas fa-image-slash text-6xl text-gray-700 mb-4"></i>
                        <p class="text-gray-500 text-sm">Imagen no disponible</p>
                    </div>
                </div>
                <div class="p-4 bg-neutral-900 flex gap-2">
                    <button onclick="copiarCodigo()" class="flex-1 bg-neutral-800 text-white py-3 rounded-lg text-sm">Copiar Código</button>
                    <button onclick="cerrarModal()" class="flex-1 btn-naranja py-3 rounded-lg text-sm">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT6EiWfmeqj01h807bJiut1jZWa3Ea_KxMcUBPxGFEiHsHNQWrlFyzs7cpWhe32n37yfxnoxmWitEni/pub?gid=0&single=true&output=csv";
        let baseDatos = [];

        window.onload = () => {
            fetch(SHEET_URL).then(r => r.text()).then(csv => {
                Papa.parse(csv, {
                    header: true, dynamicTyping: true, skipEmptyLines: true,
                    complete: (results) => {
                        baseDatos = results.data;
                        document.getElementById('loadingStatus').classList.add('hidden');
                    }
                });
            });
        };

        function buscarTroqueles() {
            const ancho = parseFloat(document.getElementById('inpAncho').value) || null;
            const largo = parseFloat(document.getElementById('inpLargo').value) || null;
            const codigo = document.getElementById('inpCodigo').value.trim().toUpperCase();
            const formato = document.getElementById('inpFormato').value;
            const tol = parseFloat(document.getElementById('inpTolerancia').value) || 5;

            const res = baseDatos.filter(i => {
                if (!i.Codigo) return false;
                return (codigo ? String(i.Codigo).toUpperCase().includes(codigo) : true) &&
                       (formato ? String(i.Formato).toUpperCase() === formato.toUpperCase() : true) &&
                       (ancho ? (i.Ancho >= ancho - tol && i.Ancho <= ancho + tol) : true) &&
                       (largo ? (i.Largo >= largo - tol && i.Largo <= largo + tol) : true);
            });

            renderizar(res);
        }

        function renderizar(lista) {
            const cont = document.getElementById('resultadosContenedor');
            cont.innerHTML = "";
            document.getElementById('contadorResultados').innerText = lista.length + " encontrados";
            lista.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-[#1e1e1e] rounded-xl p-4 flex justify-between items-center border-l-4 border-orange-500";
                div.innerHTML = `<div><div class="font-bold text-white">${item.Codigo}</div><div class="text-sm text-gray-400">${item.Ancho}x${item.Largo}mm</div></div>
                                 <button onclick="verImagen('${item.Codigo}')" class="w-10 h-10 rounded-full bg-neutral-800 text-gray-400"><i class="far fa-image"></i></button>`;
                cont.appendChild(div);
            });
        }

        function verImagen(codigo) {
            const img = document.getElementById('modalImg');
            const err = document.getElementById('errorImg');
            document.getElementById('modalTitulo').innerText = codigo;
            img.style.display = 'none'; err.style.display = 'none';
            
            // Intenta cargar .jpg minúscula primero
            img.src = `img/${codigo}.jpg`;
            img.onload = () => img.style.display = 'block';
            img.onerror = () => {
                // Si falla, intenta .JPG mayúscula
                if (!img.src.includes('.JPG')) {
                    img.src = `img/${codigo}.JPG`;
                } else {
                    err.style.display = 'block';
                }
            };
            document.getElementById('modalImagen').classList.remove('hidden');
        }

        function cerrarModal() { document.getElementById('modalImagen').classList.add('hidden'); }
        function copiarCodigo() {
            navigator.clipboard.writeText(document.getElementById('modalTitulo').innerText);
            alert("Copiado");
        }
    </script>
</body>
</html>
